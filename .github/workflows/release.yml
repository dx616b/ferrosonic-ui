name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ferrosonic-ui executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - uses: actions/checkout@v6
        with:
          repository: dx616b/ferrosonic-ng
          path: ferrosonic-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferrosonic-src
          key: musl-player

      - name: Install zig (cargo-zigbuild backend)
        run: |
          ZIG_VERSION=0.16.0
          ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o zig.tar.xz
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build ferrosonic player
        working-directory: ferrosonic-src
        env:
          CARGO_ZIGBUILD_ZIG_PATH: ${{ github.workspace }}/scripts/zig-link
        run: |
          cargo zigbuild \
            --release \
            --target x86_64-unknown-linux-musl \
            --bin ferrosonic

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        env:
          FERROSONIC_PLAYER: ferrosonic-src/target/x86_64-unknown-linux-musl/release/ferrosonic
        run: ./scripts/build-executable.sh

      - name: Stage versioned artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp dist/ferrosonic-ui "ferrosonic-ui-${VERSION}-linux-x86_64"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "One binary: web control and the ferrosonic player. Run \`ferrosonic-ui\` and open the printed URL. mpv is required for audio." \
            "ferrosonic-ui-${GITHUB_REF_NAME#v}-linux-x86_64"
